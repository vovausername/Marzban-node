services:
  marzban-node:
    image: ghcr.io/vovausername/marzban-node:latest
    # build: .  # use this instead to build from source (e.g. testing an unreleased change)
    restart: always
    network_mode: host

    # NET_ADMIN + NET_RAW let this container manage the ipset/iptables rules
    # ip_block.py uses for temporary IP blocking. Remove both if you never
    # intend to use that feature — everything else works without them.
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # env_file: .env
    environment:
      SSL_CERT_FILE: "/var/lib/marzban-node/ssl_cert.pem"
      SSL_KEY_FILE: "/var/lib/marzban-node/ssl_key.pem"
      # SSL_CLIENT_CERT_FILE: "/var/lib/marzban-node/ssl_client_cert.pem"
      # SERVICE_PROTOCOL: "rest"
      # The fork's extra features below default to enabled. Uncomment and
      # set to "false" to opt out of any of them.
      # XRAY_REMOTE_UPDATE_ENABLED: "true"
      # IP_BLOCK_ENABLED: "true"
      # XRAY_HOT_RELOAD_ENABLED: "true"
      # NODE_REMOTE_UPDATE_ENABLED only makes the node accept the panel's
      # update-node request; the update itself is done by a host-side
      # watcher — run `marzban-node.sh install-updater` on the host to
      # install it (requests are refused until then).
      # NODE_REMOTE_UPDATE_ENABLED: "true"

    volumes:
      - /var/lib/marzban-node:/var/lib/marzban-node

    # No healthcheck on purpose: the REST service requires the panel's
    # client certificate at the TLS layer (ssl_cert_reqs=2), so an
    # in-container curl of GET /healthcheck can't connect. That endpoint is
    # meant for the panel / monitoring systems holding the client cert.
